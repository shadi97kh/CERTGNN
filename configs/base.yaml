# Reference config. Group selections below are merged from configs/<group>/<name>.yaml;
# override a selection with `model=gin`, a value with `model.hidden=128`, and any
# experiment key with dotted paths. Hydra-style dotlist syntax via OmegaConf.
#   python -m experiments.gate2_link --config configs/base.yaml seeds=5 gate2.coverage.n_test=2000
groups:
  substrate: synthetic
  model: sage_sum     # chosen from results/diagnostics/ (development diagnostic, not a result)
  explainer: soft_mask
  rewire: none
  conformal: split

seeds: 10          # number of seeds when `seed` is null
seed: null         # set by the sweep launcher to run a single seed
alpha: 0.1
n_strata: 5
bootstrap_resamples: 2000
torch_threads: 1   # tiny graphs: more threads only cause OpenMP contention (48 ms scatter_add at 8 threads)

output:
  figures: paper/figures
  tables: paper/tables
  runs: results/runs

gate2:
  eta0_mean: 0.0
  eta0_std: 2.0
  links: [identity, logit, probit, cloglog]
  link_sweep:          # ABLATIONS 1.6
    n_instances: 1000
    delta: 0.1
    n_pairs: 20000
  curve_fit:           # ABLATIONS 1.7
    deltas: [0.1, 0.3, 0.7, 1.0]
    n_instances: 1000
  rank_reversal:       # ABLATIONS 1.8
    baseline_pairs: [[0.5, 0.9], [0.5, 0.95], [0.5, 0.99]]
    n_per_baseline: 200
    delta: 1.0
  coverage:            # ABLATIONS 1.9 / Gate G2
    topology:
      kind: nested_bubbles
      n_branches: 2
      depth: 2
      n_distractors: 3
    regulator: random
    delta: 1.0
    n_cal: 1000
    n_test: 5000
    explanation_ball_fraction: 0.5

gate2_model:           # experiments/gate2_model.py: 1.9 with a TRAINED model
  # Same topology, link, delta and explanation as gate2.coverage, so the only
  # thing that changes between the two runs is who computes the score.
  regulator: far       # 'random' makes the regulator structurally unidentifiable,
                       # so a trained model has nothing to learn; 'far' is learnable
  delta: 1.0
  n_train: 600
  n_val: 150
  n_cal: 600
  n_test: 1500
  explanation_ball_fraction: 0.5
  target: latent       # regress on eta, not on mu: the head must emit logits
                       # (CLAUDE.md), and the shipped y is a probability
  arms: [baseline_hidden, baseline_observable]
  min_val_r2: 0.05     # below this the model has not learned and the arm is
                       # reported as uninformative rather than as evidence

benchmark:             # ABLATIONS C.5-C.8, experiments/benchmark_reeval.py
  # CANDIDATE. The rows this serves are status: candidate and unapproved.
  root: data/benchmarks
  datasets: [mutag, ba_2motifs, tree_cycles, ba_shapes, ba_community]
  explainers: [gnn_explainer, pg_explainer, graphmask, dummy]
  max_instances: 300   # per dataset per seed; node-level datasets sample nodes
  epochs: 60
  batch_size: 32
  explainer_epochs: 100
  aopc_k: 10           # perturbation-curve depth; null uses every candidate node

ism:                   # experiments/ism_invariance.py
  n_alt: 3             # alternative values per position, the analogue of 3 alternative bases
  omega: 2.0           # warp shape parameter; strengths come from identifiability.radius
  cut: 0.95            # the within-locus Spearman below which the rule is called broken

closure_capacity:      # experiments/closure_capacity.py: does closure -> 1 with capacity?
  n_max: 4000          # matches the budget diagnostic; brackets params/n = 1
  device: cuda:1       # GPU 0 is occupied by another job; float64 is 18x slower
                       # than float32 on these TITAN RTX, so this is not free speed
  hidden: [16, 32, 64, 128]        # spans 0.06 to 9.4 params/point at n=4000, so it
                                   # brackets params/n = 1 between 64x1 (0.59) and
                                   # 128x1 (1.18). Wider cells sit far inside the
                                   # interpolation regime and cost hours for no evidence.
  depth: [1, 2, 3]
  strengths: [0.25, 0.55, 0.75, 0.95]
  omega: 2.0
  ref_epochs: 1200
  # At a fixed lr of 0.01 the 128-wide cells collapse onto the mean predictor
  # (fit_r2 = 0, loss frozen at var(y)) and their "closure" is two constants
  # agreeing. At 0.003 the same cells reach fit_r2 0.70 and 0.94. The rate is
  # therefore chosen per cell by a short pilot on the reference fit's training
  # loss only, which never sees a warp or a closure value.
  lr_ladder: [0.01, 0.003, 0.001, 0.0003]
  pilot_epochs: 300    # the collapse is fully established by ~200 epochs
  min_fit_r2: 0.05     # below this the reference never left the mean predictor;
                       # the cell is reported but excluded from the asymptote
  refit_epochs: 6000   # the budget diagnostic's curve is flat past ~4000; the
                       # deepcopy fix and the GPU make this affordable per cell
  asymptote_boot: 400

closure_shuffled:      # experiments/closure_shuffled.py: closure or interpolation?
  # Grid, epochs, lr ladder and pilot are taken from closure_capacity so the
  # protocol is identical across the two experiments and the warp column here
  # is directly comparable to the closure column there.
  strength: 0.95       # same warp strength the capacity sweep reported on
  interpolating_r2: 0.90   # shuffled target re-represented this well = interpolating
  selective_r2: 0.50       # shuffled target no better than this = selective
  selectivity_margin: 0.05 # warp must beat the non-monotone targets by this
                           # much for a cell to count as selective at all

closure_heldout:       # experiments/closure_heldout.py: containment or memorization?
  # Grid, epochs, lr ladder and pilot come from closure_capacity so the fit
  # column here is directly comparable to the closure column there.
  n_fit: 3000          # of closure_capacity.n_max = 4000; the rest is held out
  strength: 0.95       # same warp strength the capacity sweep reported on
  ceiling_min: 0.99    # null target held-out R2 below this = protocol broken
  floor_max: 0.10      # shuffled target held-out R2 above this = split leaking
  heldout_closed: 0.999999   # held-out warp R2 at or above this = contains the twin

closure_search:        # experiments/closure_search.py: can the refit FIND a member?
  # Grid, epochs, lr ladder and pilot come from closure_capacity.
  n_fit: 3000
  strength: 0.95
  search_ok: 0.999     # cold-start null held-out R2 at/above this in EVERY cell =
                       # the optimiser can reach in-class targets it did not start
                       # at, so a warp failure is about the class, not the search
  rise_margin: 0.01    # arm-2 improvement whose CI lower bound must exceed this
                       # for the larger class to count as recovering the twin

separation:            # experiments/separation.py: the quantitative claim
  n_fit: 3000
  strength: 0.95
  alpha: 0.05          # two-sided significance for the separation test
  power: 0.8
  ism_instances: 400   # held-out sequences used for the per-locus attribution
  library_size: 30483  # the full BRCA2 5'ss library, for "is Z reachable today?"
  # Jaccard on top-k sets is quantized (top-3 admits only 0, 0.2, 0.5, 1), so a
  # MEDIAN threshold anywhere in (0.5, 1] selects the same partition and only
  # looks calibrated. The branch uses the exact-set-match FRACTION instead,
  # which is continuous in the instances.
  # Set overlap only means something where a top-3 exists. Instances where a
  # model spreads its magnitude near-uniformly have an ill-conditioned top-3
  # and are excluded from the conditioned columns.
  well_conditioned_mass: 0.8   # both models must put this much of their total
                               # magnitude in their own top 3
  min_qualifying_frac: 0.10  # a cell whose instances almost never have a
                             # well-defined top-3 cannot support a claim about
                             # WHICH positions matter; it is reported as
                             # ill-posed rather than as disagreement
  exact_top3_agree: 0.8  # this fraction of instances with identical top-3 sets,
                         # in every cell, means the fits agree on WHICH positions
                         # matter and the full-rank gap is tail ordering only

occurrence:            # experiments/occurrence.py: the claim without a twin
  n_fit: 3000
  n_models: 20         # per cell, differing ONLY in initialization seed
  alpha: 0.05          # paired t-test on held-out squared errors; a pair above
                       # this is one the data cannot choose between. Uncorrected
                       # on purpose: that makes the surviving set stricter.
  ism_instances: 400
  rho_near_one: 0.95   # if every cell's median attribution rho is at least this,
                       # training pins the attribution and the verdict says so

epistasis_spectrum:    # experiments/epistasis_spectrum.py: three landscapes side by side
  gb1_min_input: 10    # Olson counts filter; MAVE-NN uses the same cut, so the
                       # retained row count is comparable to their 530,737
  ge_epochs: 4000      # additive latent + monotone GE, fitted here because
  ge_lr: 0.02          # neither MAVE-NN nor MoCHI is installed
  ge_components: 8
  # A pure-noise symmetric matrix has rank-1 fraction ~4/n, so the raw value
  # is not comparable across landscapes of different size. Every statistic is
  # therefore also computed on size-matched noise with the same mask.
  null_reps_small: 40   # n <= 500
  null_reps_large: 8    # n > 500; each draw is a full eigendecomposition
  rank_one_high: 0.80  # leading term explains at least this in EVERY landscape
                       # -> they all look rank-one and there is no contrast
  rank_one_low: 0.30   # at most this in every landscape -> none looks rank-one

identifiability_mpsa:  # experiments/identifiability_mpsa.py (real BRCA2 5'ss MPSA)
  path: data/raw/mpsa_data.csv.gz
  n_max: 4000          # sequences per seed; the full library is 30,483
  restarts: 3          # keep the best fit as the reference
  epochs: 1200
  omegas: [1.0, 2.0, 4.0]   # ISM ratio error is partly a warp-shape property; sweep it
  omega: 2.0                # closure/attribution refits stay at one omega (cost)
  ism_max: 600              # instances per ISM cell; the grid is 3 x 7 x 3 cells

identifiability:       # experiments/identifiability_probe.py
  topology: {kind: nested_bubbles, n_branches: 2, depth: 2, n_distractors: 3}
  n_instances: 800
  nonlinearity: 1.0    # weight of the quadratic term in phi*; 0 makes phi* linear
  quad_rank: 3
  scale: 2.0           # steepness of g* = sigmoid(scale * phi)
  noise: 0.01
  restarts: 12
  loss_tol: 0.20       # a refit counts as "equally good" within 20% of the best loss;
                       # too tight and a class yields one fit and no restart pair
  epochs: 1500
  warp_fit_epochs: 2000
  lr: 0.01
  hidden: 32
  ge_components: 5
  warp_strength: 0.8   # |s| < 1 keeps psi strictly monotone
  warp_omega: 2.0
  radius:              # indistinguishability radius (paper/tables/identifiability_radius.md)
    families: [sinusoid, spline, sigmoid_mixture]
    strengths: [0.1, 0.25, 0.4, 0.55, 0.7, 0.85, 0.95]
    omegas: [1.0, 2.0, 4.0]
    warp_fit_epochs: 1200   # warm-started from the reference map, so this polishes rather than relearns
    fit_tol: 1.0e-10        # stop once the in-class approximation is at machine level
    sample_sizes:      # real MPSA designs
      - {label: "FAS exon 6", n: 3072}
      - {label: "BRCA2 exon 17", n: 32768}

rank_reversal_std:     # ABLATIONS 1.8 third arm (experiments/rank_reversal_standardized.py)
  topology: {kind: nested_bubbles, n_branches: 2, depth: 2, n_distractors: 3}
  delta: 1.0
  baseline_pairs: [[0.5, 0.9], [0.5, 0.95], [0.5, 0.99]]
  n_per_baseline: 100  # scores are per-node, so each instance costs n_nodes solves

splice:                # certgnn/substrates/splice (MFASS)
  window: 10           # tiling width in nt; one node per window

gate2_splice:          # experiments/gate2_splice.py: row 1.9 on real data
  max_per_split: 4000  # cap per split to keep a 10-seed sweep tractable
  explanation_ball_fraction: 0.5
  min_test_r2: 0.02    # below this the model has not learned and the arm is
                       # reported as uninformative rather than as evidence

tier0:                 # ABLATIONS 0.6, 0.7, 0.8 (experiments/tier0_controls.py)
  substrates: [splice, connectome, synthetic]
  run_bqn_on: [connectome]        # 0.8 is a brain-substrate row
  candidates: [splice, connectome]  # substrates the verdict may recommend; synthetic is a pipeline check
  bqn: {layers: 2, clusters: 4, dropout: 0.0, epochs: 60, lr: 0.001, weight_decay: 0.0001}
  rewire_swaps_per_edge: 10
