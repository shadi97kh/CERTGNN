[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certgnn"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4", "torch-geometric>=2.6", "networkx>=3.3",
  "numpy>=1.26", "scipy>=1.13", "pandas>=2.2",
  "scikit-learn>=1.5", "pyyaml>=6.0", "hydra-core>=1.3",
  "matplotlib>=3.9", "seaborn>=0.13", "tqdm>=4.66",
  "torchcp>=0.1.3", "captum>=0.7", "wandb>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.6", "mypy>=1.11", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
include = ["certgnn*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["networkx.*", "torch_geometric.*"]
ignore_missing_imports = true
